name: CI / Production Quality Gate

on:
  push:
    branches: [main, master, release/*]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Test Suite & Invariant Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements.txt
          pip install pytest-cov

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest -v --cov=apps/backend/app --cov-report=term-missing

  frontend-tests:
    name: Frontend Test Suite & Production Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Run Vitest Unit & Integration Tests
        run: npm --prefix apps/web run test

      - name: Run TypeScript Static Type Validation
        run: npm --prefix apps/web exec tsc --noEmit

      - name: Build Web Production Bundle
        run: npm --prefix apps/web run build

  docker-validation:
    name: Dockerfile Production Build Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.backend
          push: false
          tags: aurastock-backend:ci-test

      - name: Validate Background Worker Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.worker
          push: false
          tags: aurastock-worker:ci-test

      - name: Validate Frontend Web Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.web
          push: false
          tags: aurastock-web:ci-test
