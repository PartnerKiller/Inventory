[package]
name = "aurastock-desktop"
version = "1.1.0"
description = "AuraStock Enterprise Windows Desktop Client"
authors = ["Antigravity Engineering"]
edition = "2021"
build = "build.rs"

[lib]
name = "aurastock_lib"
path = "src-tauri/src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aurastock"
path = "src-tauri/src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon", "devtools"] }
tauri-plugin-log = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"

