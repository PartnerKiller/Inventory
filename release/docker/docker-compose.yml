version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aurastock_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory_db}
      POSTGRES_USER: ${POSTGRES_USER:-inventory_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aurastock_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-inventory_user} -d $${POSTGRES_DB:-inventory_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aurastock_redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - aurastock_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: aurastock_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-inventory_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inventory_db}
      - SECRET_KEY=${SECRET_KEY:?Secret key must be set}
      - REDIS_URL=redis://redis:6379/0
      - BACKUP_DIR=/backups
      - BACKUP_RETENTION_COUNT=7
    volumes:
      - backupdata:/backups
    networks:
      - aurastock_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    container_name: aurastock_worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-inventory_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inventory_db}
      - SECRET_KEY=${SECRET_KEY:?Secret key must be set}
      - REDIS_URL=redis://redis:6379/0
      - BACKUP_DIR=/backups
      - BACKUP_RETENTION_COUNT=7
    volumes:
      - backupdata:/backups
    networks:
      - aurastock_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: aurastock_web
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - aurastock_internal
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"

networks:
  aurastock_internal:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  backupdata:
    driver: local
